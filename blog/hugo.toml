# Hugo config for the Human, blog.
#
# Multilingual: EN ships at /writing/, ZH at /zh-hant/writing/. A single
# Hugo invocation writes both; scripts/build.sh then relocates the ZH
# subtree from public/writing/zh-hant/ → public/zh-hant/writing/ so the
# Cloudflare output matches the public URL structure.
#
# Marketing pages live outside Hugo at /public/*.html.

baseURL = "https://forhuman.ca/writing/"
languageCode = "en-CA"
title = "Blog · Human,"
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableGitInfo = false
pluralizelisttitles = false
summaryLength = 40

# Pretty URLs (no trailing /index.html)
uglyURLs = false

[params]
  author = "Nico Jan"
  description = "Notes on teaching, learning, and the tools we use."

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML inside markdown when the author needs it

[markup.highlight]
  style = "github-light"
  noClasses = false

# Output the JSON feed at /writing/index.json so the homepage
# latest-posts.js can grab the newest entries.
[outputs]
  home = ["html", "rss", "json"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html"]

[taxonomies]
  tag = "tags"

[languages.en]
  languageName = "English"
  weight = 1
  title = "Blog · Human,"
  baseURL = "https://forhuman.ca/writing/"
  contentDir = "content/en"
  [languages.en.params]
    description = "Notes on teaching, learning, and the tools we use."
  [languages.en.permalinks]
    posts = "/:slug/"

[languages.zh-hant]
  languageName = "繁體中文"
  languageCode = "zh-Hant"
  weight = 2
  title = "部落格 · Human,"
  contentDir = "content/zh-hant"
  # Absolute ZH baseURL so permalinks resolve to /zh-hant/writing/… not
  # /writing/zh-hant/… (the Hugo default under a single publishDir).
  # scripts/build.sh physically relocates the publishDir subtree to match.
  baseURL = "https://forhuman.ca/zh-hant/writing/"
  [languages.zh-hant.params]
    description = "關於教學、學習，以及我們用的工具。"
  [languages.zh-hant.permalinks]
    posts = "/:slug/"

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · Writing · Human,{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}" />
<link rel="canonical" href="{{ .Permalink }}" />

<link rel="icon" type="image/svg+xml" href="/brand/human-comma-terracotta.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180x180.png" />

<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · Human,{{ end }}" />
<meta property="og:description" content="{{ with .Summary }}{{ . | plainify }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:image" content="https://forhuman.ca/brand/human-og-1200x630.png" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta name="theme-color" content="#FAF7F2" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700&family=Noto+Serif+TC:wght@400;600;700&display=swap" />

<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/pages.css" />
<link rel="stylesheet" href="/css/writing.css" />

{{ with .OutputFormats.Get "rss" -}}
<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}" />
{{- end }}

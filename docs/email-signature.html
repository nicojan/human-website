<!-- ============================================================
     Human, email signature — Nico Jan
     Select from the comment below through its closing marker,
     copy, and paste into Gmail: Settings > See all settings >
     General > Signature.

     Images are hosted on forhuman.ca (Cloudflare Workers static
     assets from human-website/public/brand/). Do not repoint them
     at a generator CDN or a Google Doc.

     The name line is serif (Literata, falling back to Georgia in
     every mail client, since none load webfonts) per AR-08, which
     lets a brand bookend set its title line in Literata. Everything
     else stays Helvetica Neue per the document pack.

     No rule above the name: "Regards," and the name are one unit,
     and a hairline between them cuts the sign-off in half. Space
     does the separating, per AR-05 and DC-03.

     The table has NO width. It shrinks to its widest line, so the
     comma always hangs 24px off the longest line whatever a client
     does to the CJK glyphs. Do not add a width — a fixed one makes
     the org line wrap wherever it renders wider than expected.
     ============================================================ -->
